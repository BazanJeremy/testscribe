[project]
name = "testscribe"
version = "0.1.0"
description = "AI-powered bug report enricher with RAG pattern classification"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "anthropic>=2.8.0",
    "flask>=3.1.3",
    "chromadb>=1.5.9",
    "sentence-transformers>=6.3.0",
    "scikit-learn>=1.9.1",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.170.15",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "playwright>=1.65.1",
    "pytest-playwright>=0.10.0",
    "allure-pytest>=2.16.2",
    "flask-testing>=0.8.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = [
    "unit: isolated unit tests",
    "integration: integration tests requiring pipeline",
    "e2e: end-to-end Playwright tests",
    "live_api: tests requiring Anthropic API key (skipped in CI)",
]
