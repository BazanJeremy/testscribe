# Tool configuration only (ruff, mypy, pytest). TestScribe is not an installable
# package: CI, the Dockerfile and both READMEs install from requirements.txt,
# which is the single dependency list. Target Python: 3.12+.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = [
    "unit: isolated unit tests",
    "integration: integration tests requiring pipeline",
    "e2e: end-to-end Playwright tests",
    "live_api: tests requiring Anthropic API key (skipped in CI)",
]
